<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" role="img" aria-label="CSC Moșnița">
  <defs>
    <clipPath id="shield-clip">
      <path d="M100,214 C55,196 13,165 12,133 L12,44 Q11,17 30,14 L100,11 L170,14 Q189,17 188,44 L188,133 C187,165 145,196 100,214Z"/>
    </clipPath>
  </defs>

  <!-- Outer shield — yellow border -->
  <path d="M100,224 C50,205 4,172 3,138 L3,42 Q1,7 24,4 L100,1 L176,4 Q199,7 197,42 L197,138 C196,172 150,205 100,224Z" fill="#F5B800"/>

  <!-- Inner shield — dark blue -->
  <path d="M100,214 C55,196 13,165 12,133 L12,44 Q11,17 30,14 L100,11 L170,14 Q189,17 188,44 L188,133 C187,165 145,196 100,214Z" fill="#1C3B7C"/>

  <g clip-path="url(#shield-clip)">

    <!-- Romanian flag band (blue | yellow | red) -->
    <rect x="12"  y="11" width="59" height="36" fill="#003DA5"/>
    <rect x="71"  y="11" width="58" height="36" fill="#FFD100"/>
    <rect x="129" y="11" width="59" height="36" fill="#CE1126"/>

    <!-- C.S.C. over flag -->
    <text x="100" y="37"
      font-family="'Arial Black','Arial Bold',Impact,sans-serif"
      font-size="20" font-weight="900" text-anchor="middle"
      fill="white" letter-spacing="3">C.S.C.</text>

    <!-- MOȘNIȚA -->
    <text x="100" y="63"
      font-family="'Arial Black','Arial Bold',Impact,sans-serif"
      font-size="15" font-weight="900" text-anchor="middle"
      fill="#F5B800" letter-spacing="2.5">MOȘNIȚA</text>

    <!-- Coat of arms: castle / tower in white -->
    <!-- left turret -->
    <rect x="67"  y="109" width="19" height="32" fill="white"/>
    <rect x="67"  y="102" width="6"  height="9"  fill="white"/>
    <rect x="75"  y="102" width="6"  height="9"  fill="white"/>
    <!-- centre tower (taller) -->
    <rect x="86"  y="99"  width="28" height="42" fill="white"/>
    <rect x="86"  y="92"  width="6"  height="9"  fill="white"/>
    <rect x="94"  y="92"  width="6"  height="9"  fill="white"/>
    <rect x="103" y="92"  width="6"  height="9"  fill="white"/>
    <!-- right turret -->
    <rect x="114" y="109" width="19" height="32" fill="white"/>
    <rect x="114" y="102" width="6"  height="9"  fill="white"/>
    <rect x="122" y="102" width="6"  height="9"  fill="white"/>
    <!-- left window -->
    <rect x="70"  y="114" width="10" height="13" rx="3" fill="#1C3B7C"/>
    <!-- right window -->
    <rect x="120" y="114" width="10" height="13" rx="3" fill="#1C3B7C"/>
    <!-- centre window -->
    <rect x="92"  y="102" width="10" height="11" rx="2" fill="#1C3B7C"/>
    <!-- door arch -->
    <path d="M94,141 L94,124 Q100,117 106,124 L106,141Z" fill="#1C3B7C"/>

    <!-- Sport silhouettes in yellow -->
    <!-- 1. FOOTBALLER — top-left, kicking right -->
    <g stroke="#F5B800" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="33" cy="75" r="5" fill="#F5B800" stroke="none"/>
      <line x1="33" y1="80"  x2="32" y2="93"  stroke-width="3.5"/>
      <line x1="32" y1="85"  x2="24" y2="91"  stroke-width="3"/>
      <line x1="32" y1="85"  x2="40" y2="82"  stroke-width="3"/>
      <line x1="32" y1="93"  x2="25" y2="104" stroke-width="3.5"/>
      <line x1="32" y1="93"  x2="44" y2="86"  stroke-width="3.5"/>
      <circle cx="47" cy="84" r="4" fill="#F5B800" stroke="none"/>
    </g>

    <!-- 2. RUNNING — top-right -->
    <g stroke="#F5B800" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="164" cy="75" r="5" fill="#F5B800" stroke="none"/>
      <line x1="163" y1="80"  x2="161" y2="93"  stroke-width="3.5"/>
      <line x1="162" y1="85"  x2="153" y2="82"  stroke-width="3"/>
      <line x1="162" y1="85"  x2="170" y2="89"  stroke-width="3"/>
      <line x1="161" y1="93"  x2="152" y2="87"  stroke-width="3.5"/>
      <line x1="161" y1="93"  x2="168" y2="104" stroke-width="3.5"/>
    </g>

    <!-- 3. RUNNING — middle-left -->
    <g stroke="#F5B800" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="26" cy="122" r="5" fill="#F5B800" stroke="none"/>
      <line x1="26" y1="127" x2="25" y2="139" stroke-width="3.5"/>
      <line x1="25" y1="132" x2="17" y2="128" stroke-width="3"/>
      <line x1="25" y1="132" x2="33" y2="136" stroke-width="3"/>
      <line x1="25" y1="139" x2="18" y2="151" stroke-width="3.5"/>
      <line x1="25" y1="139" x2="32" y2="147" stroke-width="3.5"/>
    </g>

    <!-- 4. KARATE KICK — lower-centre -->
    <g stroke="#F5B800" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="76" cy="155" r="5" fill="#F5B800" stroke="none"/>
      <line x1="76" y1="160" x2="77" y2="172" stroke-width="3.5"/>
      <line x1="77" y1="165" x2="68" y2="170" stroke-width="3"/>
      <line x1="77" y1="165" x2="85" y2="159" stroke-width="3"/>
      <line x1="77" y1="172" x2="70" y2="183" stroke-width="3.5"/>
      <line x1="77" y1="172" x2="91" y2="162" stroke-width="3.5"/>
    </g>

    <!-- 5. VOLLEYBALL — middle-right, arms raised -->
    <g stroke="#F5B800" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="168" cy="122" r="5" fill="#F5B800" stroke="none"/>
      <line x1="168" y1="127" x2="168" y2="139" stroke-width="3.5"/>
      <line x1="168" y1="131" x2="159" y2="124" stroke-width="3"/>
      <line x1="168" y1="131" x2="177" y2="124" stroke-width="3"/>
      <line x1="168" y1="139" x2="162" y2="151" stroke-width="3.5"/>
      <line x1="168" y1="139" x2="174" y2="151" stroke-width="3.5"/>
      <circle cx="168" cy="116" r="4" fill="none" stroke="#F5B800" stroke-width="2"/>
    </g>

    <!-- 6. SPORT FIGURE — lower-right -->
    <g stroke="#F5B800" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="159" cy="160" r="5" fill="#F5B800" stroke="none"/>
      <line x1="159" y1="165" x2="159" y2="177" stroke-width="3.5"/>
      <line x1="159" y1="169" x2="150" y2="174" stroke-width="3"/>
      <line x1="159" y1="169" x2="168" y2="166" stroke-width="3"/>
      <line x1="159" y1="177" x2="152" y2="188" stroke-width="3.5"/>
      <line x1="159" y1="177" x2="166" y2="187" stroke-width="3.5"/>
    </g>

  </g>
</svg>
